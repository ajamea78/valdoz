name: Security Audit & SAST

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1' # Weekly security scan every Monday at 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: GitHub CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b56ba49b26e50535fa1e7f7db0f4f7b47f4d7a9e # v3.28.10
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b56ba49b26e50535fa1e7f7db0f4f7b47f4d7a9e # v3.28.10

  sast-and-dependencies:
    name: SAST & Supply-Chain Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@f94ec6bed567a2962877829707271a3d9360c106 # v5.3.0
        with:
          version: "latest"

      - name: Run security audits
        run: |
          uv venv
          uv pip install -e ".[dev]" || true
          uvx bandit -r src/valdoz -ll
          uvx pip-audit
          uvx semgrep scan --config auto src/valdoz

      - name: Static Type Checking
        run: |
          uvx mypy src/valdoz --ignore-missing-imports || true
