name: Release & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.3.0
        with:
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies & run tests
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run pytest -v

      - name: Verify Tag Matches Version Manifest
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PYPROJECT_VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG_VER" != "$PYPROJECT_VER" ]; then
            echo "Error: Git tag $GITHUB_REF_NAME does not match pyproject.toml version $PYPROJECT_VER"
            exit 1
          fi

      - name: Build Wheel and Source Distribution
        run: |
          uv build

      - name: Generate SHA-256 Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
